plugins {
    id 'java-library'
    id 'jacoco'
}

dependencies {
    api project(':core')
    implementation project(':config')
    api libs.redisson
    api libs.jackson.databind

    compileOnly libs.lombok
    annotationProcessor libs.lombok

    implementation libs.slf4j.api
    testRuntimeOnly libs.slf4j.simple

    testImplementation libs.junit.jupiter
    testImplementation libs.mockito.core

    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok
}

// Enable JUnit 5
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

jacoco {
    // Align with mq module; supports JDK 21 class files
    toolVersion = '0.8.12'
}

// Configure coverage report for registry module (use existing task from jacoco plugin)
tasks.named('jacocoTestReport', JacocoReport) {
    // Only depend on unit tests; integration tests require Redis and should not be pulled in by coverage.
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(fileTree(dir: "$buildDir/classes/java/main"))
    sourceDirectories.setFrom(files('src/main/java'))
    // Only include unit-test execution data; integrationTest may also produce an exec when running `check`.
    executionData.setFrom(fileTree(dir: "$buildDir/jacoco", includes: ['test.exec']))
    doFirst { executionData.files.removeIf { !it.exists() } }
}

// Generate coverage after unit tests only (avoid indirectly triggering integration tests).
tasks.named('test') {
    finalizedBy(tasks.named('jacocoTestReport'))
}
// Enforce a modest coverage bar to guard regressions (configure existing task)
tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    // Verify combined coverage for unit + integration tests. `check` already runs integrationTest,
    // and the historical threshold assumes integration coverage is included.
    dependsOn tasks.named('test')
    dependsOn tasks.named('integrationTest')
    executionData.setFrom(fileTree(dir: "$buildDir/jacoco", includes: ['test.exec', 'integrationTest.exec']))
    classDirectories.setFrom(fileTree(dir: "$buildDir/classes/java/main"))
    doFirst { executionData.files.removeIf { !it.exists() } }
    violationRules {
        rule {
            // Conservative initial bar; can be raised as suite grows
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.50
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
