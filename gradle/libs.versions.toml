# Centralized dependency versions for all modules (Gradle 8+ version catalog).
# Access from build scripts via the generated `libs` accessor, e.g. `libs.redisson`.

[versions]
assertj = "3.24.2"
h2 = "2.2.224"
hikari = "5.1.0"
jackson = "2.17.0"
junit = "5.9.2"
junitPlatform = "1.9.2"
kafka = "3.6.1"
logback = "1.4.14"
lombok = "1.18.34"
micrometer = "1.12.0"
mockito = "4.6.1"
mysql = "8.3.0"
mysqlBinlog = "0.29.2"
postgresql = "42.7.1"
prometheus = "0.16.0"
redisson = "4.7.0"
slf4j = "2.0.17"
springBoot = "3.2.0"

[libraries]
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mysql-binlog = { module = "com.zendesk:mysql-binlog-connector-java", version.ref = "mysqlBinlog" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
prometheus-client = { module = "io.prometheus:simpleclient", version.ref = "prometheus" }
prometheus-httpserver = { module = "io.prometheus:simpleclient_httpserver", version.ref = "prometheus" }
redisson = { module = "org.redisson:redisson", version.ref = "redisson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
springboot-actuator = { module = "org.springframework.boot:spring-boot-actuator", version.ref = "springBoot" }
springboot-config-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "springBoot" }
springboot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "springBoot" }
springboot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "springBoot" }
springboot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBoot" }
springboot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBoot" }
