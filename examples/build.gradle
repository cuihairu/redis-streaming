plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = (project.findProperty('mainClass') ?: 'io.github.cuihairu.redis.streaming.examples.registry.ServiceRegistryExample') as String
}

dependencies {
    implementation project(':core')
    implementation project(':registry')
    implementation project(':mq')
    implementation project(':aggregation')
    implementation project(':cdc')
    implementation project(':state')
    implementation project(':checkpoint')
    implementation project(':window')
    implementation project(':sink')
    implementation project(':source')
    implementation project(':metrics')
    implementation project(':spring-boot-starter')
    implementation project(':cep')
    implementation project(':table')
    implementation project(':reliability')

    // Redis for examples
    implementation libs.redisson

    // Logging
    implementation libs.logback.classic

    // Jackson for JSON processing
    implementation libs.jackson.databind
    implementation libs.jackson.jsr310

    compileOnly libs.lombok
    annotationProcessor libs.lombok
}
