plugins {
    id 'java-library'
}

dependencies {
    // Core API definitions
    api project(':core')

    // Implementation dependencies
    implementation project(':mq')
    implementation project(':window')
    implementation project(':checkpoint')
    // Shared watermark formula (bounded out-of-orderness) used by the redis pipeline runner
    implementation project(':watermark')
    // Join operator library: the env.join sugar (U3 three-pipeline orchestration) wires
    // StreamJoinOperator/Envelope/JoinConfig into redis pipelines — same category as
    // window/checkpoint/watermark above (operator modules the engine composes)
    implementation project(':join')

    // External dependencies
    implementation libs.redisson
    implementation libs.jackson.databind
    // Use SLF4J 2.x which is required by Redisson 4.7.0
    implementation libs.slf4j.api

    compileOnly libs.lombok
    annotationProcessor libs.lombok
    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok

    // Only referenced from tests / example code, not the main runtime pipeline
    testImplementation project(':state')
    testImplementation project(':window')
    testImplementation project(':cep')
    testImplementation libs.junit.jupiter
    testImplementation libs.junit.api
    testRuntimeOnly libs.junit.engine
    testRuntimeOnly libs.junit.launcher
    testImplementation libs.mockito.core
    testRuntimeOnly libs.slf4j.simple
}
